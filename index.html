<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>תהילים</title>

    <link rel="apple-touch-icon" href="IMG_7996.jpeg">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 30px 15px 40px;
            text-align: center;
        }

        .top-icon {
            font-size: 45px;
            margin-bottom: 5px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .subtitle {
            color: #666;
            margin-top: 8px;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .back-button {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: none;
            border-radius: 10px;
            background: white;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.08);
            font-size: 17px;
            cursor: pointer;
            text-align: right;
        }

        .back-button:active {
            transform: scale(0.98);
        }

        .menu-button {
            width: 100%;
            padding: 18px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            font-size: 18px;
            text-align: right;
            cursor: pointer;
        }

        .menu-button:active {
            transform: scale(0.98);
        }

        .emoji {
            margin-right: 10px;
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .chapter-button {
            min-height: 48px;
            border: none;
            border-radius: 9px;
            background: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            font-size: 17px;
            cursor: pointer;
        }

        .chapter-button:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none;
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- מסך הבית -->

        <div id="home-screen">

            <div class="top-icon">📖</div>

            <h1>תהילים</h1>

            <div class="subtitle">
                לקריאת תהילים בכל עת
            </div>

            <button class="menu-button" onclick="showChapters()">
                לפי פרק
                <span class="emoji">📖</span>
            </button>

            <button class="menu-button">
                לפי יום
                <span class="emoji">📅</span>
            </button>

            <button class="menu-button">
                לפי יום בחודש
                <span class="emoji">🗓️</span>
            </button>

            <button class="menu-button">
                לפי נושא
                <span class="emoji">❤️</span>
            </button>

        </div>


        <!-- מסך בחירת פרק -->

        <div id="chapters-screen" class="hidden">

            <button class="back-button" onclick="showHome()">
                ← חזרה
            </button>

            <div class="top-icon">📖</div>

            <h1>לפי פרק</h1>

            <div class="subtitle">
                בחר את הפרק שברצונך לקרוא
            </div>

            <div id="chapters" class="chapter-grid"></div>

        </div>

    </div>


    <!-- חיבור קובץ JavaScript -->

    <script src="app.js"></script>


    <!-- מעבר בין המסכים -->

    <script>

        function showChapters() {

            document.getElementById("home-screen").classList.add("hidden");

            document.getElementById("chapters-screen").classList.remove("hidden");

        }


        function showHome() {

            document.getElementById("chapters-screen").classList.add("hidden");

            document.getElementById("home-screen").classList.remove("hidden");

        }

    </script>

</body>

</html>
